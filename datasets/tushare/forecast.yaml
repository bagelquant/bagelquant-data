name: forecast
source: tushare
source_dataset: forecast
category: financial_event
field_mapping:
  ts_code: ts_code
  ann_date: ann_date
  end_date: end_date
required_columns: [asset_id, time, period]
asset_column: ts_code
time_column: ann_date
period_column: end_date
