[project]
name = "bagelquant-data"
version = "0.4.0"
description = "Unified data layer for the BagelQuant ecosystem"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "BagelQuant" }]
dependencies = [
    "polars>=1.35.0",
    "pyarrow>=22.0.0",
]

[project.optional-dependencies]
tushare = [
    "pandas>=3.0.0",
    "tushare>=1.4.21",
]

[dependency-groups]
dev = [
    "pandas>=3.0.0",
    "pre-commit>=4.5.0",
    "pyright>=1.1.410",
    "pytest>=9.0.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
